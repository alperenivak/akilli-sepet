# =====================================================
# Akıllı Sepet - Yerel Gelistirme Altyapisi
# PostgreSQL + Redis + MinIO (+ opsiyonel nginx)
# Kullanim: docker-compose up -d
# nginx: host'taki backend (3001) ve admin (3000) gerektirir
# =====================================================



services:
  # PostgreSQL Veritabani
  postgres:
    image: postgres:16-alpine
    container_name: marketapp_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-marketapp}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (BullMQ kuyruk ve cache)
  redis:
    image: redis:7-alpine
    container_name: marketapp_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - S3 Uyumlu Dosya Depolama
  # Urun resimleri, ihbar fotograflari, katalog sayfalari
  minio:
    image: minio/minio:latest
    container_name: marketapp_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    ports:
      - '9000:9000'  # API
      - '9001:9001'  # Web UI (http://localhost:9001)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 20s
      retries: 3

  # pgAdmin 4 — PostgreSQL Web Arayüzü (http://localhost:5050) — sadece geliştirme
  # Giriş: PGADMIN_DEFAULT_EMAIL / PGADMIN_DEFAULT_PASSWORD (.env)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: marketapp_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@marketapp.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Nginx reverse proxy (opsiyonel — admin + API tek port)
  nginx:
    image: nginx:alpine
    container_name: marketapp_nginx
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    profiles:
      - proxy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  pgadmin_data:
