# =====================================================
# Akıllı Sepet — Production Docker Compose
# Kullanım: cp .env.docker.example .env.docker && docker compose -f docker-compose.prod.yml --env-file .env.docker up -d
# Admin paneli için Vercel önerilir; bu dosya backend + altyapı içindir.
# =====================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: marketapp_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-marketapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketapp

  redis:
    image: redis:7-alpine
    container_name: marketapp_redis_prod
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketapp

  minio:
    image: minio/minio:latest
    container_name: marketapp_minio_prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - marketapp

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketapp_backend_prod
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketapp}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - marketapp

  # Opsiyonel: Docker üzerinden admin (Vercel yerine)
  admin:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: marketapp_admin_prod
    restart: unless-stopped
    profiles:
      - with-admin
    ports:
      - '${ADMIN_PORT:-3001}:3000'
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend
    networks:
      - marketapp

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  marketapp:
    driver: bridge
